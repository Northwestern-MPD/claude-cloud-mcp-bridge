name: checks
on: [push, pull_request]
jobs:
  mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:probe
      - run: git diff --exit-code -- probe/
      - run: npm run typecheck
      - run: npm test
      - run: npm run dev:mock
      - run: npm run build
      - run: docker build -t bridge-probe .
  identity:
    runs-on: ubuntu-latest
    env:
      PG_TEST_DISPOSABLE: 'true'
      PG_TEST_ADMIN_URL: postgresql://disposable_admin:disposable_test_only@127.0.0.1:55432/mpd_identity_disposable
      PG_TEST_DATABASE_URL: postgresql://disposable_admin:disposable_test_only@127.0.0.1:55432/mpd_identity_disposable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Start disposable Postgres 17 and matching backup tools
        run: docker compose -p mpd-m2-tests -f compose.identity-test.yml up -d --wait
      - name: Mark the disposable test cluster
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const client = new pg.Client({ connectionString: process.env.PG_TEST_ADMIN_URL });
          await client.connect();
          try { await client.query("COMMENT ON DATABASE mpd_identity_disposable IS 'mpd_identity_disposable_test_only'"); }
          finally { await client.end(); }
          NODE
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run test:identity-container
      - name: Stop disposable Postgres
        if: always()
        run: docker compose -p mpd-m2-tests -f compose.identity-test.yml down
